<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS System</title>
  <style>
    body {
      background-color: #080b10;
      color: #00f0ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }

    .title {
      font-size: 20px;
      letter-spacing: 3px;
      font-weight: 300;
      margin-bottom: 25px;
      text-transform: uppercase;
      text-shadow: 0 0 10px #00f0ff;
    }

    .arc-container {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 3px solid #00f0ff;
      box-shadow: 0 0 25px #00f0ff, inset 0 0 25px #00f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .arc-container.active {
      box-shadow: 0 0 50px #00f0ff, inset 0 0 35px #00f0ff;
      transform: scale(1.08);
    }

    .arc-core {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 20px #ffffff;
    }

    .chat-box {
      width: 100%;
      max-width: 420px;
      height: 220px;
      background: rgba(10, 18, 30, 0.85);
      border: 1px solid #00f0ff44;
      border-radius: 12px;
      padding: 15px;
      overflow-y: auto;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .msg {
      margin: 10px 0;
      font-size: 14px;
      line-height: 1.4;
    }

    .user {
      color: #ffffff;
      text-align: right;
    }

    .jarvis {
      color: #00f0ff;
      text-align: left;
    }

    .controls {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 420px;
    }

    input {
      flex: 1;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #00f0ff55;
      background: #0d131f;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    button {
      padding: 12px 20px;
      background: #00f0ff;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="title">J.A.R.V.I.S.</div>

  <div class="arc-container" id="reactor" onclick="startVoiceInput()">
    <div class="arc-core"></div>
  </div>

  <div class="chat-box" id="chat">
    <div class="msg jarvis">JARVIS en línea. Toca el reactor o escribe un mensaje.</div>
  </div>

  <div class="controls">
    <input type="text" id="userInput" placeholder="Escribe o habla..." />
    <button onclick="sendMsg()">Enviar</button>
  </div>

  <script>
    const BACKEND_URL = "https://jarvis-backend-01hl.onrender.com";

    async function sendMsg() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      appendMsg(text, 'user');
      input.value = '';

      try {
        const res = await fetch(`${BACKEND_URL}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });

        const data = await res.json();
        appendMsg(data.text, 'jarvis');

        if (data.audio) {
          const audio = new Audio("data:audio/mp3;base64," + data.audio);
          audio.play();
        }
      } catch (e) {
        appendMsg("Error de conexión con el servidor.", 'jarvis');
      }
    }

    function appendMsg(text, sender) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerText = (sender === 'user' ? "Tú: " : "JARVIS: ") + text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function startVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Tu navegador no soporta entrada de voz.");
        return;
      }
      const rec = new SpeechRecognition();
      rec.lang = 'es-ES';
      document.getElementById('reactor').classList.add('active');
      rec.start();

      rec.onresult = (e) => {
        document.getElementById('userInput').value = e.results[0][0].transcript;
        document.getElementById('reactor').classList.remove('active');
        sendMsg();
      };

      rec.onerror = () => document.getElementById('reactor').classList.remove('active');
    }
  </script>
</body>
</html>
